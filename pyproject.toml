[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revcyclemgmt-remit-denial-ops"
version = "0.1.0"
description = "Synthetic remit reconciliation and denial-routing portfolio demo."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
rcm-remit-denial = "revcyclemgmt_remit_denial.ops:main"

[project.optional-dependencies]
app = [
  "pandas>=2.2",
  "streamlit>=1.34",
]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
